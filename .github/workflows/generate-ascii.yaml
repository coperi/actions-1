name: Generate ASCII Art
on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
          
        - name: CheckoutRepo
          uses: actions/checkout@v6

        - name: Install cowsay
          run: sudo apt-get install cowsay

        - name: Execute cowsay commands
          run: cowsay -f dragon "Hello World!"

        - name: GREP dragon file
          run: grep "dragon" -r .

        - name: Read dragon file
          run: cat dragon.txt

